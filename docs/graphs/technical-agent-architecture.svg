<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description" data-layout-version="cloudy-native-v2" data-spec-sha256="d65388b2b27243f4857b0b99d2ddf681433c426c0e7dba07ab59cbb7957ad234">
  <title id="title">Agent pipeline: floor plan to validated STL</title>
  <desc id="description">Technical architecture of the reachable bumps pipeline from upload preprocessing through five Gemini agents, human review, deterministic tactile validation, and STL export.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#57534e"/></marker>
    <style>
      text { font-family: "Comic Sans MS", "Segoe Print", cursive; }
      .title { font-size: 36px; fill: #292524; }
      .subtitle { font-size: 17px; fill: #78716c; }
      .zone-label { font-size: 14px; letter-spacing: 1px; }
      .node-title { font-size: 20px; fill: #292524; }
      .node-body { font-size: 15px; fill: #44403c; }
      .node-note { font-size: 13px; fill: #57534e; }
      .edge-label { font-size: 13px; fill: #57534e; paint-order: stroke; stroke: #fffdf8; stroke-width: 4px; stroke-linejoin: round; }
      .footer { font-size: 13px; fill: #57534e; }
      .arrow { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf8"/>
  <text x="54" y="62" class="title">Agent pipeline: floor plan to validated STL</text>
  <text x="54" y="94" class="subtitle">Five Vertex AI agents exchange constrained JSON; TypeScript owns loops, persistence, validation, and export gates</text>
  <rect data-zone-id="ingress" x="42.0" y="130" width="329.4" height="690" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="62.0" y="160" class="zone-label" fill="#1e40af">1 · INGEST + ORCHESTRATION</text>
  <rect data-zone-id="extraction" x="399.4" y="130" width="372.3" height="690" rx="28" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="419.4" y="160" class="zone-label" fill="#5b21b6">2 · EXTRACTION + VERIFICATION</text>
  <rect data-zone-id="review" x="799.7" y="130" width="315.0" height="690" rx="28" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="819.7" y="160" class="zone-label" fill="#92400e">3 · HUMAN CONTROL</text>
  <rect data-zone-id="tactile" x="1142.7" y="130" width="415.3" height="690" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1162.7" y="160" class="zone-label" fill="#166534">4 · TACTILE + EXPORT</text>
  <path class="arrow" data-edge="upload--orchestrator" d="M206.7 337.0 V490.0" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <path class="arrow" data-edge="orchestrator--parser" d="M341.4 558.0 H385.4 V258.0 H429.4" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="parser--critic" d="M585.5 314.0 V327.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="critic--openings" d="M585.5 489.0 V629.0" stroke="#7c3aed" marker-end="url(#arrow-violet)"/>
  <path class="arrow" data-edge="openings--human-edit" d="M741.7 710.0 H785.7 V408.0 H829.7" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path class="arrow" data-edge="human-edit--convert" d="M1084.7 408.0 H1128.7 V258.0 H1172.7" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path class="arrow" data-edge="convert--layout" d="M1350.4 322.0 V342.0" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path class="arrow" data-edge="layout--export" d="M1350.4 474.0 V642.0" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <rect class="node" data-node-id="upload" data-status="implemented" x="72.0" y="179.0" width="269.4" height="158.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="206.7" y="214.0" text-anchor="middle" class="node-title">Ingest one floor plan</text>
  <text x="206.7" y="245.0" text-anchor="middle" class="node-body">IN PDF/PNG/JPG/WebP · 10 MB</text>
  <text x="206.7" y="267.0" text-anchor="middle" class="node-body">PDF page 1→PNG · images</text>
  <text x="206.7" y="289.0" text-anchor="middle" class="node-body">downscaled</text>
  <text x="206.7" y="319.0" text-anchor="middle" class="node-note">Rejects invalid input</text>
  <rect class="node" data-node-id="orchestrator" data-status="implemented" x="72.0" y="490.0" width="269.4" height="136.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="206.7" y="525.0" text-anchor="middle" class="node-title">Hono job runner</text>
  <text x="206.7" y="556.0" text-anchor="middle" class="node-body">202 + polling · Postgres</text>
  <text x="206.7" y="578.0" text-anchor="middle" class="node-body">JSON · plan/STL files</text>
  <text x="206.7" y="608.0" text-anchor="middle" class="node-note">Process-local · no durable queue</text>
  <rect class="node" data-node-id="parser" data-status="implemented" x="429.4" y="202.0" width="312.3" height="112.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="585.5" y="237.0" text-anchor="middle" class="node-title">ParserAgent → FloorModel</text>
  <text x="585.5" y="268.0" text-anchor="middle" class="node-body">IN plan/crops/dimensions</text>
  <text x="585.5" y="290.0" text-anchor="middle" class="node-body">OUT Zod FloorModel + confidence</text>
  <rect class="node" data-node-id="critic" data-status="implemented" x="429.4" y="327.0" width="312.3" height="162.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="585.5" y="362.0" text-anchor="middle" class="node-title">CritiqueAgent ↺</text>
  <text x="585.5" y="388.0" text-anchor="middle" class="node-title">ParserAgent</text>
  <text x="585.5" y="419.0" text-anchor="middle" class="node-body">IN source/overlay/render/audits</text>
  <text x="585.5" y="441.0" text-anchor="middle" class="node-body">OUT findings/verdict/confidence</text>
  <text x="585.5" y="471.0" text-anchor="middle" class="node-note">Full reparse · max 5 · salvage</text>
  <rect class="node" data-node-id="openings" data-status="implemented" x="429.4" y="629.0" width="312.3" height="162.0" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="585.5" y="664.0" text-anchor="middle" class="node-title">OpeningsAuditAgent →</text>
  <text x="585.5" y="690.0" text-anchor="middle" class="node-title">door ops</text>
  <text x="585.5" y="721.0" text-anchor="middle" class="node-body">IN model + door crops</text>
  <text x="585.5" y="743.0" text-anchor="middle" class="node-body">OUT keep/move/delete/add</text>
  <text x="585.5" y="773.0" text-anchor="middle" class="node-note">Guarded · failure is non-blocking</text>
  <rect class="node" data-node-id="human-edit" data-status="implemented" x="829.7" y="330.5" width="255.0" height="155.0" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="957.2" y="365.5" text-anchor="middle" class="node-title">Human + EditAgent</text>
  <text x="957.2" y="396.5" text-anchor="middle" class="node-body">Canvas→ops ·</text>
  <text x="957.2" y="418.5" text-anchor="middle" class="node-body">prompt→EditAgent</text>
  <text x="957.2" y="448.5" text-anchor="middle" class="node-note">Client-only gate · versioned</text>
  <text x="957.2" y="467.5" text-anchor="middle" class="node-note">models</text>
  <rect class="node" data-node-id="convert" data-status="implemented" x="1172.7" y="194.0" width="355.3" height="128.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1350.4" y="229.0" text-anchor="middle" class="node-title">Deterministic tactile core</text>
  <text x="1350.4" y="260.0" text-anchor="middle" class="node-body">Model → plates/braille/symbols</text>
  <text x="1350.4" y="282.0" text-anchor="middle" class="node-body">Repair + validate</text>
  <text x="1350.4" y="304.0" text-anchor="middle" class="node-body">scale/margins/clearance</text>
  <rect class="node" data-node-id="layout" data-status="implemented" x="1172.7" y="342.0" width="355.3" height="132.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1350.4" y="377.0" text-anchor="middle" class="node-title">TactileLayoutAgent ↔</text>
  <text x="1350.4" y="403.0" text-anchor="middle" class="node-title">validator</text>
  <text x="1350.4" y="434.0" text-anchor="middle" class="node-body">Violations → braille/symbol moves</text>
  <text x="1350.4" y="456.0" text-anchor="middle" class="node-body">Revalidate · max 4 · reject worse</text>
  <rect class="node" data-node-id="export" data-status="implemented" x="1172.7" y="642.0" width="355.3" height="136.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1350.4" y="677.0" text-anchor="middle" class="node-title">Zero violations unlock STL</text>
  <text x="1350.4" y="708.0" text-anchor="middle" class="node-body">OUT map + sliced plates + legends</text>
  <text x="1350.4" y="730.0" text-anchor="middle" class="node-body">Manifold mesh · bounds · triangles</text>
  <text x="1350.4" y="760.0" text-anchor="middle" class="node-note">Invalid or unfinished → HTTP 409/404</text>
  <text x="224.7" y="413.5" text-anchor="middle" class="edge-label">prepared plan + project row</text>
  <text x="603.5" y="559.0" text-anchor="middle" class="edge-label">accepted model</text>
  <rect x="54" y="844" width="1492" height="36" rx="14" fill="#f5f5f4" stroke="#d6d3d1"/>
  <text x="800" y="868" text-anchor="middle" class="footer">Five ADK LlmAgents use Gemini on Vertex AI. TypeScript owns loops, schema gates, persistence, and STL authorization.</text>
</svg>
