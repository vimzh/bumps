<header><div><h1>bumps / technical agent architecture</h1><p>Floor-plan extraction, agent review, human correction, standards validation, and watertight STL export.</p></div><div class="meta">VERTEX AI + GOOGLE ADK<br>BUN / HONO / POSTGRES / MANIFOLD</div></header>
